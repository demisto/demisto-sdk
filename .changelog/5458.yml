changes:
- description: Docker image push now verifies the image is pullable after pushing.
  type: feature
- description: Docker image push now fails loudly when the push did not succeed.
  type: fix
- description: Post-push image verification now correctly routes GAR-hosted devtestdemisto
    images through a registry (daemon) pull instead of the DockerHub Registry API,
    preventing a false-positive verification that let first-time-pushed images race
    registry propagation and fail docker-in-docker pre-commit hooks with "manifest
    unknown".
  type: fix
- description: Increased the post-push image propagation-wait window to ~10 minutes
    (20 attempts) to accommodate slow propagation of large first-time-pushed images
    (e.g. chromium) through the GAR virtual registry.
  type: fix
pr_number: 5458
