changes:
- description: The **validate** command now builds/updates the content graph automatically
    when a selected validation needs it (graph validations and the connectors flow),
    so the `--graph` flag is no longer required for those. `--graph` remains as an
    optional connect-only shortcut for CI where the graph is built beforehand.
  type: feature
- description: Reduced the number of content-graph queries performed by the connectors
    validation flow by batching the handler/integration cross-matching lookups into
    a single query per content type instead of one query per item.
  type: internal
pr_number: '5480'
