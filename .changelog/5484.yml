changes:
- description: Fixed an issue where a derived (managed) pack and the pack it was derived from were calculated as depending on each other. Their shared tightly coupled content items belong to both packs, which made the dependency calculation infer a **DEPENDS_ON** relationship between the two, sometimes in both directions. All three queries that produce pack dependencies now exclude packs belonging to the same split-pack family.
  type: fix
- description: Fixed an issue where managed and derived packs were assigned pack-level dependencies. Such packs ship to the Managed Content bucket as self-contained units, so they now carry no **DEPENDS_ON** relationship in either direction, and a derived pack no longer inherits the dependencies declared in the originating pack's metadata.
  type: fix
- description: Fixed an issue where the all-level pack dependencies query produced invalid cypher when mandatory-only filtering was disabled.
  type: fix
- description: Fixed an issue where a **DEPENDS_ON** relationship between a pack and its derived (managed) twin survived a graph rebuild. The relationships preserved while pack nodes are recreated were captured for every relationship type, which restored such a dependency after the queries that create them had already excluded it.
  type: fix
- description: Fixed an issue where a **DEPENDS_ON** relationship involving a managed or derived pack was never removed when it originated from pack metadata. Only calculated relationships were cleared before recalculation, so in a graph that is reused between builds such a relationship remained indefinitely.
  type: fix
- description: Fixed an issue where a **DEPENDS_ON** relationship involving a managed or derived pack could still reach the graph through a path that did not consult the dependency queries. Pack dependencies are now swept once after they are calculated, so no managed or derived pack depends on another pack, and no pack depends on one, regardless of how the relationship was created.
  type: fix
- description: Added a **current_version** field to every pack entry in **pack_destinations.json**, carrying the pack version as recorded on the content graph. Consumers of the artifact can now determine a pack's version without opening the dumped pack. An empty value is written as null.
  type: feature
pr_number: '5484'
