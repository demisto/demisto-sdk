changes:
- description: Added a new optional **supportedFeatures** field (list of strings) to all content item types and to pack_metadata.json. A content item that does not declare the field inherits it from its pack. When neither declares it, the key is omitted entirely from the output and marketplace artifacts. When the field is declared it must hold real feature names - an empty list, or a list containing empty or whitespace-only values, is rejected.
  type: feature
- description: The **GR105** duplicate-ID validation is now region-aware - content items may share an ID when they are provably never active in the same region, according to **Config/regional_rules.json**. Duplicates whose regions cannot be resolved are still reported. When the **Config/regional_rules.json** file is not available, region-awareness is skipped and every duplicate ID is reported, as before.
  type: feature
- description: Added the **ST115** validation, ensuring a content item's **supportedFeatures** are a subset of its pack's.
  type: feature
- description: Added the **BA134** validation, ensuring every declared **supportedFeatures** value exists under **supported_features** in **Config/regional_rules.json**. The validation runs on packs as well as content items, so a typo in **pack_metadata.json** is reported once at its source rather than on every item inheriting it.
  type: feature
- description: The **supportedFeatures** field now rejects duplicate entries.
  type: feature
- description: Added a shared resolver for a content item's effective **supportedFeatures**, and a reader for **Config/regional_rules.json**.
  type: internal
- description: Improved the **GR105** duplicate-ID error message. A duplicate reported because its regions could not be resolved no longer claims the items are active in "all regions" or that their features overlap. Which duplicates are reported is unchanged.
  type: fix
- description: Fixed a content item not inheriting its pack's **supportedFeatures** when the pack had not already been resolved. The item was treated as available everywhere, and **ST115** did not report an item declaring a feature its pack disallows.
  type: fix
- description: The **GR105** duplicate-ID validation now logs a warning, rather than an informational message, when **Config/regional_rules.json** is unavailable, since every duplicate ID is reported in that case regardless of the regions it is restricted to.
  type: fix
pr_number: 5508
