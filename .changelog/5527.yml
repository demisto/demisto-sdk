changes:
- description: Fixed an issue where the **GR109** and **GR114** validations could crash with an AttributeError, aborting the entire validate run, depending on the order in which validators ran. The validations now check only the dependencies returned by their own graph query, instead of every relationship cached on the content item by previously executed validators (such as relationships to content items missing from the repository, which are reported by **GR103**).
  type: fix
pr_number: '5527'
