changes:
- description: Added the AgentixFlow content type, with graph parsing and preparation for upload. A flow is a `<Flow>.yml` content item with a `<Flow>_flow.json` flow-engine file and LangGraph code under `src/`; on dump, the SDK ships `agentixflow-<Flow>.yml`, `agentixflow-<Flow>.json` (with `zip_path` set) and a deterministic `agentixflow-<Flow>.zip` of the `src/` code.
  type: feature
