changes:
- description: Updated the hardcoded docker images in all init templates (BaseIntegration, BaseScript, FeedHelloWorld, HelloIAMWorld, HelloWorld, HelloWorldEventCollector, HelloWorldScript, HelloWorldSlim) and in the postman codegen fallback to demisto/python3:3.12.13.10116658, so scaffolded content no longer targets Python versions below 3.10.
  type: internal
- description: Fixed an issue where the cached global docker client kept the timeout of whichever caller created it first, so callers requesting a longer timeout (such as container creation and commit, which use DOCKER_CONTAINER_TIMEOUT) were silently capped at 60 seconds and failed with a ReadTimeout against slow docker daemons. The client's timeout is now raised when a caller requires a longer one, and never lowered.
  type: fix
pr_number: 'xxxx'
