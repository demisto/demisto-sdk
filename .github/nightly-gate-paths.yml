# Configuration for the SDK Nightly Gate workflow.
#
# Classifies files changed in a PR into three tiers:
#
#   must         -> hard fail unless the PR carries `nightly-run-passed`
#                   or `nightly-run-skipped` label.
#   recommended  -> pass, but post a warning comment when neither label
#                   is present; the author is expected to add one of them.
#   skip         -> matches are ignored (highest precedence). Use this to
#                   exclude tests, docs, test fixtures, etc.
#
# Precedence rules applied by `check_nightly_gate.py`:
#   1. If a file matches any `skip` glob, it is ignored entirely.
#   2. Otherwise, if it matches any `must` glob, the PR tier is `must`.
#   3. Otherwise, if it matches any `recommended` glob, the PR tier is
#      `recommended` (unless a Must match is found on another file).
#   4. Otherwise the file is not relevant to the gate.
#
# Style guide: prefer broad `<subtree>/**` globs and let `skip:` prune
# noise (tests, fixtures, docs, images). This keeps the tier lists short
# and self-explanatory - "everything in this area needs nightly, except
# what the global `skip` list already handles".
#
# Glob syntax: gitignore-style. `**` matches any number of directory
# levels; `*` matches within a single path segment.

must:
  # Entire content_graph subtree. Tests and images are already pruned by
  # `skip:` below, so this covers parsers, objects, interface,
  # strict_objects, commands, and the top-level .py files in one line.
  - "demisto_sdk/commands/content_graph/**"

  # Validate-side "must" bits (the rest of `validate/` is recommended).
  - "demisto_sdk/commands/validate/private_content_manager.py"
  - "demisto_sdk/commands/validate/validators/GR_validators/**"

  # Docker helpers under commands/common. `docker**` covers both
  # `docker.py` and the `docker_helper/` package.
  - "demisto_sdk/commands/common/docker**"

recommended:
  # `demisto_sdk/commands/validate/**` intentionally overlaps with the Must
  # entries above. When a file matches both, Must wins (see precedence).
  - "demisto_sdk/commands/validate/**"
  - "demisto_sdk/commands/prepare_content/**"
  - "demisto_sdk/commands/upload/**"
  - "demisto_sdk/commands/create_artifacts/**"
  - "demisto_sdk/commands/update_release_notes/**"
  - "demisto_sdk/commands/pre_commit/**"
  # Cross-cutting helpers that half the SDK imports. Kept as individual
  # entries because `common/**` would sweep in unrelated files.
  - "demisto_sdk/commands/common/git_util.py"
  - "demisto_sdk/commands/common/tools.py"
  - "demisto_sdk/commands/common/constants.py"

skip:
  - "**/tests/**"
  - "**/test_data/**"
  - "**/*.md"
  - "**/README*"
  - "demisto_sdk/commands/content_graph/images/**"
