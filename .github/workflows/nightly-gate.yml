name: SDK Nightly Gate

# ---------------------------------------------------------------------------
# Enforces the SDK Nightly policy defined in `.github/nightly-gate-paths.yml`.
#
# For every pull request, this workflow:
#
#   1. Diffs the PR head against its base branch to get the list of
#      changed files.
#   2. Runs `check_nightly_gate.py` to classify those files into
#      `must` / `recommended` / `skip_only` / `none` tiers.
#   3. Checks the PR's labels for `nightly-run-passed` or
#      `nightly-run-skipped`.
#   4. Posts / updates a single sticky comment describing the outcome,
#      and fails the job only when a Must-tier file was changed
#      without one of the two labels applied.
#
# The workflow re-runs on `labeled` / `unlabeled` events so a red check
# turns green as soon as the author applies the correct label - no
# push required.
# ---------------------------------------------------------------------------

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: nightly-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege token: we need to read PR metadata, write comments,
# and read repository content for the diff.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ensure-labels:
    # Idempotently create the two labels the gate depends on, so a fresh
    # fork or a repo without them pre-provisioned still works.
    name: Ensure gate labels exist
    runs-on: ubuntu-latest
    steps:
      - name: Create/update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          create_label () {
            local name="$1" color="$2" description="$3"
            # `--force` updates color/description if the label already
            # exists, and is a no-op on identical labels.
            gh label create "$name" \
              --color "$color" \
              --description "$description" \
              --force
          }
          create_label "nightly-run-passed" "0e8a16" \
            "SDK Nightly pipeline was run and passed for this PR."
          create_label "nightly-run-skipped" "fbca04" \
            "SDK Nightly pipeline was intentionally skipped for this PR (recommended-tier only)."

  gate:
    name: Check SDK Nightly gate
    runs-on: ubuntu-latest
    needs: ensure-labels
    steps:
      - name: Checkout PR head with full history
        # `fetch-depth: 0` is required so we can `git diff` against the
        # base branch without a shallow-clone error.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/setup_environment
        with:
          python-version: "3.12"

      - name: Compute changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/nightly-gate"
          out="${RUNNER_TEMP}/nightly-gate/changed.txt"
          # Use `...` (symmetric difference) to compare against the
          # merge-base, matching what GitHub's PR view shows.
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "$out"
          echo "Changed files ($(wc -l < "$out") total):"
          cat "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Classify changes and decide
        id: classify
        env:
          # Space-safe: labels come in as JSON; we collapse to CSV.
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          labels_csv=$(python -c "import json,os; print(','.join(json.loads(os.environ['PR_LABELS_JSON'])))")
          echo "PR labels: $labels_csv"
          poetry run python -m Utils.github_workflow_scripts.nightly_gate.check_nightly_gate \
            --config .github/nightly-gate-paths.yml \
            --changed-files "${{ steps.diff.outputs.path }}" \
            --labels "$labels_csv"

      - name: Upsert sticky PR comment
        # Runs whether the classify step passed or failed, so a failing
        # gate still leaves the author with actionable feedback.
        if: always() && github.event.pull_request.number != null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ steps.classify.outputs.comment_body }}
          DELETE_COMMENT: ${{ steps.classify.outputs.delete_comment }}
        run: |
          set -euo pipefail
          marker='<!-- nightly-gate-bot -->'

          # Find every existing bot comment. In practice there should be
          # at most one, but historical bugs or a race between multiple
          # `synchronize` events could leave duplicates behind. We
          # collect ALL of them so we can enforce "exactly one bot
          # comment on this PR" as a hard invariant.
          #
          # Result: newline-separated list of comment IDs, oldest first
          # (GitHub returns issue comments in creation order).
          existing_ids=$(gh api \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq "map(select(.body | contains(\"${marker}\"))) | .[].id")

          # Split into an array without failing on empty input.
          mapfile -t existing_id_array < <(printf '%s\n' "${existing_ids}" | grep -v '^$' || true)
          existing_count=${#existing_id_array[@]}
          echo "Found ${existing_count} existing gate comment(s) on PR #${PR_NUMBER}."

          delete_comment_id () {
            local id="$1"
            echo "Deleting gate comment ${id}"
            gh api -X DELETE \
              "repos/${GH_REPO}/issues/comments/${id}" >/dev/null
          }

          if [[ "${DELETE_COMMENT}" == "true" ]]; then
            # Files no longer touch any gated path (e.g. author reverted
            # the change). Clean up EVERY stale gate comment so the PR
            # is left with none.
            if (( existing_count > 0 )); then
              for id in "${existing_id_array[@]}"; do
                delete_comment_id "${id}"
              done
            else
              echo "No gated files and no existing comment - nothing to do."
            fi
            exit 0
          fi

          if [[ -z "${COMMENT_BODY}" ]]; then
            echo "No comment body produced by classifier; skipping."
            exit 0
          fi

          # `gh` reads the body from stdin via `-F body=@-` to preserve
          # newlines and avoid shell-quoting issues with Markdown.
          if (( existing_count > 0 )); then
            # Keep the OLDEST comment (first in the array) so its URL is
            # stable across runs, edit it in place, and delete every
            # extra duplicate. This enforces "exactly one gate comment".
            keep_id="${existing_id_array[0]}"
            echo "Updating existing gate comment ${keep_id}"
            printf '%s' "${COMMENT_BODY}" | gh api -X PATCH \
              "repos/${GH_REPO}/issues/comments/${keep_id}" \
              -F body=@-  >/dev/null

            if (( existing_count > 1 )); then
              echo "Deduplicating: removing $((existing_count - 1)) stale duplicate comment(s)."
              for id in "${existing_id_array[@]:1}"; do
                delete_comment_id "${id}"
              done
            fi
          else
            echo "Creating new gate comment"
            printf '%s' "${COMMENT_BODY}" | gh api -X POST \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@-  >/dev/null
          fi
