type: map
mapping:
  regex;(.+_raw):
    type: map
    mapping:
      dataset_description:
        type: str
        required: false
      regex;(.+):
        type: map
        mapping:
          type:
            type: str
            required: true
            enum: ["string", "int", "float", "datetime", "boolean"]
          is_array:
            type: bool
            required: true
          field_description:
            type: str
            required: false
