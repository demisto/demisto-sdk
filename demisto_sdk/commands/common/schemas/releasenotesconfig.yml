type: map
mapping:
  breakingChanges:
    type: bool
    required: false
  breakingChangesNotes:
    type: str
    required: false
  marketplaces:
    type: seq
    required: false
    sequence:
    - type: str
      enum: ['xsoar', 'marketplacev2', 'xpanse', 'xsoar_saas', 'xsoar_on_prem', 'platform']
  supportedModules:
    type: seq
    sequence:
    - type: str
  # Optional coupling-aware breaking-change notes for the ConnectUS (Managed Content) flow.
  # Omitting it preserves full backward compatibility. See CIAC-17085 / CIAC-17086.
  forceUpdate:
    type: map
    required: false
    mapping:
      breakingChangesNotesLoosely:
        type: str
        required: false
      breakingChangesNotesTightly:
        type: any
        required: false
